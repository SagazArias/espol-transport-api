name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: espol
          POSTGRES_PASSWORD: espol_dev
          POSTGRES_DB: espol_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U espol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://espol:espol_dev@localhost:5432/espol_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (pytest contra PostgreSQL, con migraciones)
        run: pytest -q -p no:warnings
